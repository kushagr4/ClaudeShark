[project]
name = "claudeshark"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chess==1.11.2",
    "numpy==2.5.2",
    "numba==0.67.0",
    "torch==2.13.0",
    "onnxruntime==1.29.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["mypy>=1.18", "ruff>=0.14", "pytest>=8.3"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Frozen champions are historical snapshots kept as arena opponents. They must
# stay byte-identical to the version that was measured, so they are not linted.
exclude = ["champions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]

[tool.mypy]
strict = true
files = ["agent.py", "cs_constants.py", "cs_eval.py", "cs_ordering.py", "cs_search.py", "cs_time.py", "cs_tt.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
