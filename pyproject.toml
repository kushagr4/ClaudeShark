[project]
name = "claudeshark"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chess==1.11.2",
    "numpy==2.5.2",
    "numba==0.67.0",
    "torch==2.13.0",
    "onnxruntime==1.29.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["mypy>=1.18", "ruff>=0.14", "pytest>=8.3"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Frozen champions are historical snapshots kept as arena opponents. They must
# stay byte-identical to the version that was measured, so they are not linted.
exclude = ["champions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
# Diagnostic report tooling: wide f-string tables are clearer on one line.
"tools/postmortem/*" = ["E501"]
"tools/repetition/*" = ["E501"]
"tools/conversion/*" = ["E501"]
"tools/mopup/*" = ["E501"]
"tools/blindwin/*" = ["E501"]
"tools/passed/*" = ["E501"]

[tool.mypy]
strict = true
# Every module that ships. cs_see.py was missing from this list for a whole
# version, so a production module went untyped; the release checker's
# "engine modules packaged" check and this list must both cover the same set.
files = [
    "agent.py",
    "cs_constants.py",
    "cs_eval.py",
    "cs_king.py",
    "cs_mopup.py",
    "cs_passed.py",
    "cs_ordering.py",
    "cs_search.py",
    "cs_see.py",
    "cs_time.py",
    "cs_tt.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
